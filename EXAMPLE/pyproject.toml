[project]
name = "example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "databases[aiosqlite]>=0.9.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.136.3",
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "requests>=2.34.2",
    "ruff>=0.15.14",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "api: mark a test as an api test",
    "newmark: custom mark for teaching/testing"
]
